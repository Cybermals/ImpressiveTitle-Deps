name: Build ImpressiveTitle Dependencies
on:
  push:
    branches:
    - main
jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Repo
      uses: actions/checkout@v6
    - name: Install Build Dependencies
      run: |
        sudo apt install xorg-dev libgl-dev libglu-dev libfreeimage-dev libfreetype-dev libpulse-dev
    - name: Build Ogre Dependencies
      run: |
        cmake -S ogredeps -B ogredeps-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=ogre_src_v1-7-4/Dependencies -DOGREDEPS_BUILD_AMD_QBS=false -DOGREDEPS_BUILD_NVIDIA_NVAPI=false -DOGREDEPS_BUILD_SDL2=false -DOGREDEPS_BUILD_FREEIMAGE=false -DOGREDEPS_BUILD_FREETYPE=false -DOGREDEPS_BUILD_ZLIB=false -DOGREDEPS_BUILD_RAPIDJSON=false -DOGREDEPS_BUILD_REMOTERY=false
        cmake --build ogredeps-build
        cmake --install ogredeps-build
        cp -r ogredeps/src/Cg/include/ ogre_src_v1-7-4/Dependencies/
        cp -r ogredeps/src/Cg/lib64/*.so ogre_src_v1-7-4/Dependencies/lib/
        mkdir zziplib/
        mkdir zziplib/include/
        mkdir zziplib/lib/
        cp -r ogre_src_v1-7-4/Dependencies/include/zzip/ zziplib/include/
        cp ogre_src_v1-7-4/Dependencies/lib/libzziplib.a zziplib/lib/
    - name: Build Ogre
      run: |
        cmake -S ogre_src_v1-7-4 -B ogre-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=Ogre -DCg_INCLUDE_DIR=ogre_src_v1-7-4/Dependencies/include/Cg -DCg_LIBRARY_DBG=ogre_src_v1-7-4/Dependencies/lib -DCg_LIBRARY_REL=ogre_src_v1-7-4/Dependencies/lib
        cmake --build ogre-build
        cmake --install ogre-build
        sudo cp -r Ogre/bin/* /usr/bin/
        sudo cp -r Ogre/include/* /usr/include/
        sudo cp -r Ogre/lib/* /usr/lib/
    - name: Build OgrePagedGeometry
      run: |
        cmake -S ogre-pagedgeometry-1.2.0 -B ogre-pagedgeometry-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=PagedGeometry -DPAGEDGEOMETRY_BUILD_SAMPLES=false
        cmake --build ogre-pagedgeometry-build
        cmake --install ogre-pagedgeometry-build
    - name: Build RakNet
      run: |
        cmake -S RakNet-master -B RakNet-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=RakNet
        cmake --build RakNet-build
        cmake --install RakNet-build
        mkdir RakNet/
        mkdir RakNet/include/
        mkdir RakNet/lib/
        cp -r RakNet-master/include/raknet/* RakNet/include/
        cp -r RakNet-master/Lib/DLL/*.so RakNet/lib/
    - name: Gather Build Outputs
      run: |
        mkdir -p deps/linux/amd64/gcc13/
        mv Ogre/ deps/linux/amd64/gcc13/
        cp -r ogre_src_v1-7-4/Dependencies/* deps/linux/amd64/gcc13/Ogre/
        mv PagedGeometry/ deps/linux/amd64/gcc13/
        mv RakNet/ deps/linux/amd64/gcc13/
        mv zziplib/ deps/linux/amd64/gcc13/
    - name: Adjust Build Output Paths
      run: |
        mv deps/linux/amd64/gcc13/Ogre/lib/OGRE/* deps/linux/amd64/gcc13/Ogre/lib/
        rm -r deps/linux/amd64/gcc13/Ogre/lib/OGRE/
        rm -r deps/linux/amd64/gcc13/Ogre/lib/cmake/
        rm -r deps/linux/amd64/gcc13/Ogre/lib/pkgconfig/
        mv deps/linux/amd64/gcc13/PagedGeometry/include/PagedGeometry/* deps/linux/amd64/gcc13/PagedGeometry/include/
        rm -r deps/linux/amd64/gcc13/PagedGeometry/include/PagedGeometry/
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: it-deps-linux
        path: deps/
  build-win32-vc18:
    runs-on: windows-2025-vs2026
    steps:
    - name: Clone Repo
      uses: actions/checkout@v6
    - name: Install Legacy DirectX SDK
      shell: powershell
      run: |
        Write-Host "Downloading Legacy DirectX SDK Archive..."
        $url = "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe"
        Invoke-WebRequest -Uri $url -OutFile "dx_sdk.exe"
        
        Write-Host "Creating structural destination directory..."
        $targetDir = "C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)"
        $tempExtractDir = "$pwd\dx_temp_stage"
        
        New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
        New-Item -ItemType Directory -Path $tempExtractDir -Force | Out-Null
        
        Write-Host "Extracting primary wrapper..."
        & "7z" x dx_sdk.exe -o"$tempExtractDir" -y | Out-Null
        
        Write-Host "Extracting all nested payload layers recursively..."
        # By using 'x' instead of 'e' and pointing to the .cab files, 
        # 7-Zip will automatically dig through the inner cabinet layers.
        Get-ChildItem -Path $tempExtractDir -Filter "*.cab" | ForEach-Object {
            & "7z" x $_.FullName -o"$targetDir" -y | Out-Null
        }
        
        # Sometimes the cabinet files extract into their own subdirectories like 'd3dx9_43_x86'
        # We search for d3dx9.h and d3d9.lib dynamically and move them to standard paths
        Write-Host "Consolidating files for CMake..."
        $includePath = New-Item -ItemType Directory -Path "$targetDir\Include" -Force | Out-Null
        $libPath = New-Item -ItemType Directory -Path "$targetDir\Lib\x86" -Force | Out-Null
        
        # Find any header file scattered in the tree and move it to \Include
        Get-ChildItem -Path $targetDir -Filter "*.h" -Recurse | ForEach-Object {
            if ($_.FullName -notlike "*\Include\*") {
                Move-Item -Path $_.FullName -Destination "$targetDir\Include\" -Force -ErrorAction SilentlyContinue
            }
        }
        
        # Find any x86 static library file and move it to \Lib\x86
        Get-ChildItem -Path $targetDir -Filter "*.lib" -Recurse | ForEach-Object {
            if ($_.FullName -notlike "*\Lib\*") {
                Move-Item -Path $_.FullName -Destination "$targetDir\Lib\x86\" -Force -ErrorAction SilentlyContinue
            }
        }
        
        Write-Host "=== VERIFYING DESTINATION ==="
        if (Test-Path "$targetDir\Include\d3dx9.h") {
            Write-Host "Success! Found d3dx9.h inside the Include tree."
        } else {
            Write-Warning "d3dx9.h still missing. Printing top 20 discovered files to trace layout:"
            Get-ChildItem -Path $targetDir -Recurse | Select-Object -First 20 FullName
        }
        
        # Define the environment variable for your Ogre CMake build step
        Add-Content -Path $env:GITHUB_ENV -Value "DXSDK_DIR=$targetDir"
    - name: Build Ogre Dependencies
      run: |
        cmake -S ogredeps -B ogredeps-build -A Win32 -DCMAKE_INSTALL_PREFIX=ogre_src_v1-7-4/Dependencies -DOGREDEPS_BUILD_AMD_QBS=false -DOGREDEPS_BUILD_NVIDIA_NVAPI=false -DOGREDEPS_BUILD_SDL2=false -DOGREDEPS_BUILD_RAPIDJSON=false -DOGREDEPS_BUILD_REMOTERY=false
        cmake --build ogredeps-build --config Release
        cmake --install ogredeps-build
    - name: Build Ogre
      run: |
        cmake -S ogre_src_v1-7-4 -B ogre-build -A Win32 -DCMAKE_INSTALL_PREFIX=Ogre -DCg_INCLUDE_DIR=ogre_src_v1-7-4/Dependencies/include/Cg -DCg_LIBRARY_DBG=ogre_src_v1-7-4/Dependencies/lib -DCg_LIBRARY_REL=ogre_src_v1-7-4/Dependencies/lib
        cmake --build ogre-build --config Release
        cmake --install ogre-build
    - name: Build OgrePagedGeometry
      run: |
        cmake -S ogre-pagedgeometry-1.2.0 -B ogre-pagedgeometry-build -A Win32 -DCMAKE_INSTALL_PREFIX=PagedGeometry -DOgre_INCLUDE_DIRS=Ogre/include/Ogre -DOgre_LIBRARY_DIRS=Ogre/lib -DOis_INCLUDE_DIRS=ogre_src_v1-7-4/Dependencies/include/OIS -DOis_LIBRARY_DIRS=ogre_src_v1-7-4/Dependencies/lib -DPAGEDGEOMETRY_BUILD_SAMPLES=false
        cmake --build ogre-pagedgeometry-build --config Release
        cmake --install ogre-pagedgeometry-build
    - name: Build RakNet
      run: |
        cmake -S RakNet-master -B RakNet-build -A Win32 -DCMAKE_INSTALL_PREFIX=RakNet
        cmake --build RakNet-build --config Release
        cmake --install RakNet-build
    - name: Gather Build Outputs
      shell: powershell
      run: |
        mkdir -p deps/windows/amd64/vc18/
        mv Ogre/ deps/windows/amd64/vc18/
        # cp -r ogre_src_v1-7-4/Dependencies/* deps/windows/amd64/vc18/Ogre/
        mv PagedGeometry/ deps/windows/amd64/vc18/
        mv RakNet/ deps/windows/amd64/vc18/
        mv zziplib/ deps/windows/amd64/vc18/
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: it-deps-win32-vc18
        path: deps/
